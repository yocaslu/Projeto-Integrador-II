# Produção na VM (Ubuntu Server + Docker), atrás do Traefik.
# Uso: TAG=<sha> docker compose -f infra/compose.prod.yml --env-file .env up -d

services:
  traefik:
    image: traefik:v3.5
    # Configuração estática por argumentos; a dinâmica (middlewares) fica em infra/traefik/.
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dinamico
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.middlewares=seguranca@file
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik/dinamico:ro
      - letsencrypt:/letsencrypt
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  backend:
    image: ghcr.io/yocaslu/projeto-integrador-ii/backend:${TAG:-latest}
    env_file: ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - ../dados:/dados
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${DOMINIO}`) && (PathPrefix(`/api`) || PathPrefix(`/admin`))
      - traefik.http.routers.api.entrypoints=websecure
      - traefik.http.routers.api.tls.certresolver=letsencrypt
      - traefik.http.services.api.loadbalancer.server.port=8000
    restart: unless-stopped

  frontend:
    image: ghcr.io/yocaslu/projeto-integrador-ii/frontend:${TAG:-latest}
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${DOMINIO}`)
      - traefik.http.routers.web.entrypoints=websecure
      - traefik.http.routers.web.tls.certresolver=letsencrypt
      - traefik.http.services.web.loadbalancer.server.port=80
    restart: unless-stopped

volumes:
  pgdata:
  letsencrypt:
