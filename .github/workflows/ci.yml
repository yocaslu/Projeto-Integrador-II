name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nesta fase só o backend é desenvolvido (CLAUDE.md, "Escopo atual"): os jobs do frontend e de
  # ponta a ponta rodam apenas quando o push ou o PR muda frontend/ ou e2e/. Pulados, aparecem
  # como "skipped", o que conta como aprovado nas checagens obrigatórias.
  mudancas:
    name: Detectar mudanças
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filtro.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filtro
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Sem base conhecida (ex.: primeiro push), roda tudo por segurança.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(frontend|e2e)/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend (Ruff e pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: anuario_test
          POSTGRES_USER: anuario
          POSTGRES_PASSWORD: anuario
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anuario"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: chave-somente-para-ci
      POSTGRES_DB: anuario_test
      POSTGRES_USER: anuario
      POSTGRES_PASSWORD: anuario
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Instalar dependências
        run: uv sync --locked
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (formatação)
        run: uv run ruff format --check .
      - name: Migrações pendentes
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Testes com cobertura mínima de 75%
        run: uv run pytest
      - name: Importação da planilha real (1.980 registros, sem divergências)
        run: uv run pytest -m planilha_real --no-cov
      - name: Esquema OpenAPI versionado em dia
        run: |
          uv run python manage.py spectacular --validate --fail-on-warn --file "$RUNNER_TEMP/openapi.yaml"
          if ! diff -u ../docs/api/openapi.yaml "$RUNNER_TEMP/openapi.yaml"; then
            echo "::error file=docs/api/openapi.yaml::Esquema desatualizado. Regenere com: manage.py spectacular --validate --fail-on-warn > docs/api/openapi.yaml"
            exit 1
          fi
      - name: Desempenho (RNF02, p95 < 500 ms; ADR 0005)
        run: uv run pytest -m desempenho --no-cov

  frontend:
    name: Frontend (Jest e build)
    needs: [mudancas]
    if: needs.mudancas.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --ci
      - run: npm run build

  e2e:
    name: Ponta a ponta e acessibilidade
    runs-on: ubuntu-latest
    needs: [mudancas, backend, frontend]
    if: needs.mudancas.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Subir o ambiente
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - name: Esperar o frontend
        # O serviço roda npm install antes do Vite e não tem healthcheck: o --wait não cobre isso.
        run: timeout 180 sh -c 'until curl -sf http://localhost:5173 > /dev/null; do sleep 2; done'
      - name: Carregar os dados
        # Sem carga concluída a API responde 503 (contrato, 7.1) e o painel não teria o que mostrar.
        run: |
          docker compose exec -T backend uv run python manage.py migrate
          docker compose exec -T backend uv run python manage.py importar_anuario
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Executar testes
        working-directory: e2e
        run: npx playwright test
      - name: Logs do ambiente em caso de falha
        if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
