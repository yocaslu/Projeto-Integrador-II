name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Ruff e pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: anuario_test
          POSTGRES_USER: anuario
          POSTGRES_PASSWORD: anuario
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anuario"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: chave-somente-para-ci
      POSTGRES_DB: anuario_test
      POSTGRES_USER: anuario
      POSTGRES_PASSWORD: anuario
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Instalar dependências
        run: uv sync --locked
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (formatação)
        run: uv run ruff format --check .
      - name: Testes com cobertura mínima de 75%
        run: uv run pytest

  frontend:
    name: Frontend (Jest e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --ci
      - run: npm run build

  e2e:
    name: Ponta a ponta e acessibilidade
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Subir o ambiente
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Executar testes
        working-directory: e2e
        run: npx playwright test
      - name: Logs do ambiente em caso de falha
        if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
