      - ocorrencias
      type: string
      description: |-
        * `vitimas` - Número de vítimas
        * `ocorrencias` - Número de ocorrências
    Variacao:
      type: object
      description: Em relação ao ano anterior; `taxa_pct` é a variação da taxa, a
