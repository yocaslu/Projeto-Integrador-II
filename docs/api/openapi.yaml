      properties:
        ano_referencia:
          type: integer
        valor_pct:
          type: string
          pattern: ^-?\d+\.\d{2}$
          example: '40.94'
          readOnly: true
          nullable: true
        taxa_pct:
          type: string
          pattern: ^-?\d+\.\d{2}$
          example: '40.94'
          readOnly: true
          nullable: true
      required:
