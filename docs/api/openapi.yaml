openapi: 3.0.3
info:
  title: API do Anuário Brasileiro de Segurança Pública
  version: 1.0.0
  description: 'Indicadores do Anuário Brasileiro de Segurança Pública 2026. Fontes:
    Fórum Brasileiro de Segurança Pública (FBSP) e IBGE.'
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
paths:
  /api/v1/estados/:
    get:
      operationId: api_v1_estados_list
      description: As 27 UFs, por sigla, com a região a que pertencem (contrato, 4.2).
      summary: Unidades da Federação
      parameters:
      - in: query
        name: formato
        schema:
          type: string
          enum:
          - json
        description: Formato da resposta. Este recurso só tem JSON; `csv` → 406.
      - in: query
        name: regiao
        schema:
          type: string
        description: Lista de siglas de região separadas por vírgula (N, NE, SE, S,
          CO). `BR` → 400.
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Estado'
          description: ''
  /api/v1/estados/{uf}/:
    get:
      operationId: api_v1_estados_retrieve
      description: Sigla sem diferença de caixa; sigla inexistente → 404.
      summary: Uma Unidade da Federação
      parameters:
      - in: query
        name: formato
        schema:
          type: string
          enum:
          - json
        description: Formato da resposta. Este recurso só tem JSON; `csv` → 406.
      - in: path
        name: uf
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estado'
          description: ''
  /api/v1/fontes/:
    get:
      operationId: api_v1_fontes_list
      description: Catálogo fixo de fontes, por id (contrato, 4.5; ADR 0005).
      summary: Fontes dos dados
      parameters:
      - in: query
        name: formato
        schema:
          type: string
          enum:
          - json
        description: Formato da resposta. Este recurso só tem JSON; `csv` → 406.
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fonte'
          description: ''
  /api/v1/indicadores/:
    get:
      operationId: api_v1_indicadores_list
      description: Lista plana, pela ordem da hierarquia (pré-ordem). A hierarquia
        significa "contido em", nunca "soma de" (contrato, 4.3). A árvore aninhada
        está em /metadados/.
      summary: Indicadores
      parameters:
      - in: query
        name: formato
        schema:
          type: string
          enum:
          - json
        description: Formato da resposta. Este recurso só tem JSON; `csv` → 406.
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Indicador'
          description: ''
  /api/v1/indicadores/{slug}/:
    get:
      operationId: api_v1_indicadores_retrieve
      description: Slug inexistente → 404.
      summary: Um indicador
      parameters:
      - in: query
        name: formato
        schema:
          type: string
          enum:
          - json
        description: Formato da resposta. Este recurso só tem JSON; `csv` → 406.
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Indicador'
          description: ''
  /api/v1/populacao/:
    get:
      operationId: api_v1_populacao_lista
      description: 'Estimativas do IBGE usadas no cálculo das taxas (contrato, 4.6).
        Mesma regra de nível de /registros/: sem `nivel`, só as UFs.'
      summary: População
      parameters:
      - in: query
        name: ano
        schema:
          type: string
        description: 'Lista de anos (ex.: `2024,2025`).'
      - in: query
        name: ano_max
        schema:
          type: integer
        description: Último ano do intervalo fechado.
      - in: query
        name: ano_min
        schema:
          type: integer
        description: Primeiro ano do intervalo fechado.
      - in: query
        name: formato
        schema:
          type: string
          enum:
          - json
        description: Formato da resposta. Este recurso só tem JSON; `csv` → 406.
      - in: query
        name: nivel
        schema:
          type: string
        description: 'Lista de `pais`, `regiao`, `uf`. Sem `nivel`, `uf` nem `regiao`:
          só as UFs. Misturar níveis só por lista explícita (ex.: `pais,regiao,uf`),
          e então sem `uf`/`regiao`.'
      - in: query
        name: ordenar
        schema:
          type: string
        description: 'Lista de `ano`, `localidade`, `valor`; `-` inverte. Ordem padrão:
          localidade (canônica), ano; depois `id`.'
      - in: query
        name: pagina
        schema:
          type: integer
        description: Página, a partir de 1. Além da última → 400.
      - in: query
        name: regiao
        schema:
          type: string
        description: 'Lista de siglas de região (N, NE, SE, S, CO); exige `nivel`:
          com `nivel=uf`, as UFs da região; com `nivel=regiao`, o agregado. `BR` →
          400.'
      - in: query
        name: tamanho
        schema:
          type: integer
        description: 'Itens por página: padrão 100, máximo 1000.'
      - in: query
        name: uf
        schema:
          type: string
        description: 'Lista de siglas de UF (ex.: `SP,RJ`); implica `nivel=uf`.'
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDePopulacao'
          description: ''
  /api/v1/recortes/:
    get:
      operationId: api_v1_recortes_list
      description: Recortes de agentes (corporação e situação do policial), por chave,
        com os indicadores que têm registros em cada um (contrato, 4.4). O `id` é
        o que se passa em `recorte=` nos outros recursos.
      summary: Recortes
      parameters:
      - in: query
        name: formato
        schema:
          type: string
          enum:
          - json
        description: Formato da resposta. Este recurso só tem JSON; `csv` → 406.
      - in: query
        name: indicador
        schema:
          type: string
        description: 'Lista de slugs separados por vírgula: só os recortes com registros
          desses indicadores.'
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recorte'
          description: ''
  /api/v1/regioes/:
    get:
      operationId: api_v1_regioes_list
      description: As cinco regiões e o total nacional, em ordem canônica (BR, N,
        NE, SE, S, CO), com as siglas das UFs de cada uma (contrato, 4.1).
      summary: Regiões e Brasil
      parameters:
      - in: query
        name: formato
        schema:
          type: string
          enum:
          - json
        description: Formato da resposta. Este recurso só tem JSON; `csv` → 406.
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Regiao'
          description: ''
  /api/v1/regioes/{sigla}/:
    get:
      operationId: api_v1_regioes_retrieve
      description: Sigla sem diferença de caixa; sigla inexistente → 404.
      summary: Uma região ou o Brasil
      parameters:
      - in: query
        name: formato
        schema:
          type: string
          enum:
          - json
        description: Formato da resposta. Este recurso só tem JSON; `csv` → 406.
      - in: path
        name: sigla
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Regiao'
          description: ''
  /api/v1/registros/:
    get:
      operationId: api_v1_registros_lista
      description: 'Tabela de fatos com valor, taxa, variação, participação, situação
        do dado, método e fonte (contrato, 4.7). Por padrão, só totais (`recorte=total`),
        na unidade padrão de cada indicador (`unidade=padrao`) e só as UFs: vítimas
        e ocorrências, totais e recortes, Brasil, regiões e UFs nunca se misturam
        por omissão.'
      summary: Registros
      parameters:
      - in: query
        name: ano
        schema:
          type: string
        description: 'Lista de anos (ex.: `2024,2025`).'
      - in: query
        name: ano_max
        schema:
          type: integer
        description: Último ano do intervalo fechado.
      - in: query
        name: ano_min
        schema:
          type: integer
        description: Primeiro ano do intervalo fechado.
      - in: query
        name: formato
        schema:
          type: string
          enum:
          - json
        description: Formato da resposta. Este recurso só tem JSON; `csv` → 406.
      - in: query
        name: incluir_subtipos
        schema:
          type: boolean
        description: '`true` inclui todos os descendentes dos indicadores; exige `indicador`.'
      - in: query
        name: indicador
        schema:
          type: string
        description: Lista de slugs. Agrupador (`furto`) exige `incluir_subtipos=true`.
      - in: query
        name: nivel
        schema:
          type: string
        description: 'Lista de `pais`, `regiao`, `uf`. Sem `nivel`, `uf` nem `regiao`:
          só as UFs. Misturar níveis só por lista explícita (ex.: `pais,regiao,uf`),
          e então sem `uf`/`regiao`.'
      - in: query
        name: ordenar
        schema:
          type: string
        description: 'Lista de campos; `-` inverte. Campos: ano, indicador, localidade,
          recorte, unidade, valor, taxa, variacao_valor, variacao_taxa, participacao.
          Depois vem a ordem padrão (indicador, localidade, recorte, unidade, ano)
          e `id`; nulos sempre ao final.'
      - in: query
        name: pagina
        schema:
          type: integer
        description: Página, a partir de 1. Além da última → 400.
      - in: query
        name: recorte
        schema:
          type: string
        description: '`total` (padrão): só registros sem recorte; `todos`; ou lista
          de ids de /recortes/ (só esses recortes).'
      - in: query
        name: regiao
        schema:
          type: string
        description: 'Lista de siglas de região (N, NE, SE, S, CO); exige `nivel`:
          com `nivel=uf`, as UFs da região; com `nivel=regiao`, o agregado. `BR` →
          400.'
      - in: query
        name: situacao
        schema:
          type: string
        description: Lista de `informado`, `inexistente`, `nao_disponivel`.
      - in: query
        name: tamanho
        schema:
          type: integer
        description: 'Itens por página: padrão 100, máximo 1000.'
      - in: query
        name: uf
        schema:
          type: string
        description: 'Lista de siglas de UF (ex.: `SP,RJ`); implica `nivel=uf`.'
      - in: query
        name: unidade
        schema:
          type: string
        description: '`padrao` (padrão): a unidade padrão de cada indicador; `todas`;
          ou lista de `vitimas`, `ocorrencias`.'
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDeRegistros'
          description: ''
  /api/v1/registros/{id}/:
    get:
      operationId: api_v1_registros_detalhe
      description: O mesmo objeto de um item de /registros/; id inexistente → 404.
      summary: Um registro
      parameters:
      - in: query
        name: formato
        schema:
          type: string
          enum:
          - json
        description: Formato da resposta. Este recurso só tem JSON; `csv` → 406.
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registro'
          description: ''
components:
  schemas:
    BaseTaxaEnum:
      enum:
      - 100 mil habitantes
      - 100 mil mulheres
      - 100 mil veículos
      - 100 instituições
      type: string
      description: |-
        * `100 mil habitantes` - Habitantes
        * `100 mil mulheres` - Mulheres
        * `100 mil veículos` - Veiculos
        * `100 instituições` - Instituicoes
    BlankEnum:
      enum:
      - ''
    Estado:
      type: object
      properties:
        sigla:
          type: string
          maxLength: 2
        nome:
          type: string
          maxLength: 50
        codigo_ibge:
          type: string
          maxLength: 2
        regiao:
          $ref: '#/components/schemas/RegiaoResumo'
      required:
      - codigo_ibge
      - nome
      - regiao
      - sigla
    Fonte:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        nome:
          type: string
          maxLength: 200
        descricao:
          type: string
        url:
          type: string
          format: uri
          maxLength: 500
      required:
      - descricao
      - id
      - nome
      - slug
      - url
    FonteResumo:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
      required:
      - id
      - nome
    Indicador:
      type: object
      description: Item de /indicadores/ (contrato, 4.3). Lista plana; a árvore fica
        em /metadados/.
      properties:
        slug:
          type: string
          maxLength: 60
          pattern: ^[-a-zA-Z0-9_]+$
        nome:
          type: string
          maxLength: 120
        descricao:
          type: string
        unidade_padrao:
          $ref: '#/components/schemas/UnidadeEnum'
        unidades:
          type: array
          items:
            type: string
          readOnly: true
          description: Unidades com registros, na ordem vitimas, ocorrencias.
        base_taxa:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/BaseTaxaEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        fonte_taxa:
          allOf:
          - $ref: '#/components/schemas/FonteResumo'
          nullable: true
        indicador_pai:
          type: string
          readOnly: true
        subtipos:
          type: array
          items:
            type: string
          readOnly: true
          description: Slugs dos filhos diretos, na ordem.
        possui_registros:
          type: boolean
          readOnly: true
        anos:
          type: array
          items:
            type: integer
          readOnly: true
          description: Anos com registros, crescentes.
        recortes:
          type: array
          items:
            $ref: '#/components/schemas/RecorteResumo'
          readOnly: true
      required:
      - anos
      - fonte_taxa
      - indicador_pai
      - nome
      - possui_registros
      - recortes
      - slug
      - subtipos
      - unidade_padrao
      - unidades
    IndicadorResumo:
      type: object
      properties:
        slug:
          type: string
        nome:
          type: string
      required:
      - nome
      - slug
    Localidade:
      type: object
      description: '`{"nivel", "codigo", "codigo_ibge", "nome"}` de um registro ou
        de uma população.'
      properties:
        nivel:
          type: string
          readOnly: true
        codigo:
          type: string
          readOnly: true
        codigo_ibge:
          type: string
          readOnly: true
        nome:
          type: string
          readOnly: true
      required:
      - codigo
      - codigo_ibge
      - nivel
      - nome
    MetodoEnum:
      enum:
      - publicado
      - soma_ufs
      type: string
      description: |-
        * `publicado` - Publicado pelo FBSP
        * `soma_ufs` - Calculado pelo projeto como soma das UFs
    NullEnum:
      enum:
      - null
    PaginaDePopulacao:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/Populacao'
      required:
      - count
      - next
      - previous
      - results
    PaginaDeRegistros:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/Registro'
      required:
      - count
      - next
      - previous
      - results
    Participacao:
      type: object
      description: Parcela no indicador-pai ou no total do indicador; não some participações.
      properties:
        referencia:
          allOf:
          - $ref: '#/components/schemas/Referencia'
          nullable: true
          readOnly: true
        valor_pct:
          type: string
          pattern: ^-?\d+\.\d{2}$
          example: '40.94'
          readOnly: true
          nullable: true
      required:
      - referencia
      - valor_pct
    Populacao:
      type: object
      description: Item de /populacao/ (contrato, 4.6).
      properties:
        id:
          type: integer
        ano:
          type: integer
        localidade:
          $ref: '#/components/schemas/Localidade'
        valor:
          type: string
          pattern: ^-?\d+$
          example: '5800'
          readOnly: true
        fonte:
          $ref: '#/components/schemas/FonteResumo'
      required:
      - ano
      - fonte
      - id
      - localidade
      - valor
    Recorte:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        rotulo:
          type: string
          maxLength: 200
        chave:
          type: string
          maxLength: 200
        itens:
          type: array
          items:
            $ref: '#/components/schemas/RecorteItem'
        indicadores:
          type: array
          items:
            type: string
          readOnly: true
          description: Slugs dos indicadores com registros nesse recorte.
      required:
      - chave
      - id
      - indicadores
      - itens
      - rotulo
    RecorteDoRegistro:
      type: object
      description: '`{"id", "rotulo", "itens"}`; `itens` na ordem da chave (dimensões
        em ordem alfabética).'
      properties:
        id:
          type: integer
        rotulo:
          type: string
        itens:
          type: array
          items:
            $ref: '#/components/schemas/RecorteItem'
      required:
      - id
      - itens
      - rotulo
    RecorteItem:
      type: object
      properties:
        dimensao:
          type: string
        valor:
          type: string
      required:
      - dimensao
      - valor
    RecorteResumo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        rotulo:
          type: string
          maxLength: 200
      required:
      - id
      - rotulo
    Referencia:
      type: object
      properties:
        tipo:
          $ref: '#/components/schemas/ReferenciaTipoEnum'
        indicador:
          type: string
      required:
      - indicador
      - tipo
    ReferenciaTipoEnum:
      enum:
      - indicador_pai
      - total_do_indicador
      type: string
      description: |-
        * `indicador_pai` - indicador_pai
        * `total_do_indicador` - total_do_indicador
    Regiao:
      type: object
      properties:
        sigla:
          type: string
          maxLength: 2
        nome:
          type: string
          maxLength: 50
        tipo:
          $ref: '#/components/schemas/RegiaoTipoEnum'
        codigo_ibge:
          type: string
          maxLength: 2
        estados:
          type: array
          items:
            type: string
          readOnly: true
          description: Siglas das UFs; no Brasil, as 27.
      required:
      - codigo_ibge
      - estados
      - nome
      - sigla
      - tipo
    RegiaoResumo:
      type: object
      properties:
        sigla:
          type: string
          maxLength: 2
        nome:
          type: string
          maxLength: 50
      required:
      - nome
      - sigla
    RegiaoTipoEnum:
      enum:
      - regiao
      - pais
      type: string
      description: |-
        * `regiao` - Região
        * `pais` - País
    Registro:
      type: object
      description: Item de /registros/ e corpo de /registros/{id}/ (contrato, 4.7.4).
      properties:
        id:
          type: integer
        ano:
          type: integer
        localidade:
          $ref: '#/components/schemas/Localidade'
        indicador:
          $ref: '#/components/schemas/IndicadorResumo'
        recorte:
          allOf:
          - $ref: '#/components/schemas/RecorteDoRegistro'
          nullable: true
        unidade:
          $ref: '#/components/schemas/UnidadeEnum'
        valor:
          type: string
          pattern: ^-?\d+$
          example: '5800'
          readOnly: true
          nullable: true
        situacao:
          $ref: '#/components/schemas/SituacaoEnum'
        metodo:
          $ref: '#/components/schemas/MetodoEnum'
        taxa:
          $ref: '#/components/schemas/Taxa'
        taxa_publicada:
          type: string
          pattern: ^-?\d+(\.\d{1,12})?$
          example: '40.9415826'
          readOnly: true
          nullable: true
        variacao:
          $ref: '#/components/schemas/Variacao'
        participacao:
          $ref: '#/components/schemas/Participacao'
        fonte:
          $ref: '#/components/schemas/FonteResumo'
        observacao:
          type: string
          nullable: true
      required:
      - ano
      - fonte
      - id
      - indicador
      - localidade
      - metodo
      - observacao
      - participacao
      - recorte
      - situacao
      - taxa
      - taxa_publicada
      - unidade
      - valor
      - variacao
    SituacaoEnum:
      enum:
      - informado
      - inexistente
      - nao_disponivel
      type: string
      description: |-
        * `informado` - Informado
        * `inexistente` - Fenômeno inexistente
        * `nao_disponivel` - Informação não disponível
    Taxa:
      type: object
      description: Sempre presente; `origem` e `fonte` nulas quando não há taxa (ADR
        0008).
      properties:
        valor:
          type: string
          pattern: ^-?\d+\.\d{2}$
          example: '40.94'
          readOnly: true
          nullable: true
        base:
          type: string
          nullable: true
        origem:
          type: string
          nullable: true
        fonte:
          allOf:
          - $ref: '#/components/schemas/FonteResumo'
          nullable: true
          readOnly: true
      required:
      - base
      - fonte
      - origem
      - valor
    UnidadeEnum:
      enum:
