[project]
name = "anuario-backend"
version = "1.4.0"
description = "API REST dos indicadores do Anuário Brasileiro de Segurança Pública"
readme = "../README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.14"
dependencies = [
    "django==6.1.2",
    "djangorestframework==3.18.3",
    "django-filter==26.2",
    "drf-spectacular==0.30.0",
    "psycopg[binary]==3.3.6",
    "pandas==3.0.6",
    "openpyxl==3.1.5",
    "odfpy==1.4.1",
    "gunicorn==26.2.0",
]

[dependency-groups]
dev = [
    "ruff==0.17.2",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["apps/*/migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "DJ",  # django
    "SIM", # simplify
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
addopts = "--cov=apps --cov=config --cov-report=term-missing --cov-report=xml -m 'not desempenho and not planilha_real'"
markers = [
    "planilha_real: importa a planilha completa de dados/brutos/ (uv run pytest -m planilha_real --no-cov)",
    "desempenho: teste de tempo de resposta do RNF02 (uv run pytest -m desempenho --no-cov; ADR 0005)",
]

[tool.coverage.run]
omit = ["*/migrations/*", "config/wsgi.py", "config/settings/dev.py", "config/settings/prod.py"]

[tool.coverage.report]
fail_under = 75
show_missing = true
